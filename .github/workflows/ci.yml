name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
      - name: Cài phụ thuộc
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Định dạng (black)
        run: black --check .
      - name: Kiểm thử (pytest)
        run: pytest -q

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            ingestion/requirements.txt
      - name: Cài phụ thuộc
        run: pip install -r backend/requirements-dev.txt -r ingestion/requirements.txt
      - name: Lint (ruff)
        run: ruff check ingestion scripts tests
      - name: Định dạng (black)
        run: black --check ingestion scripts tests
      - name: Kiểm thử (pytest)
        run: pytest tests/ingestion -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài phụ thuộc
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build
        run: npm run build
