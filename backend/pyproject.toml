[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/.venv/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
