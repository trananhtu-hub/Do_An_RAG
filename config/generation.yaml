version: 1
prompt_version: v1
default_thinking_level: medium
# Câu tra cứu đơn giản (tra_cuu, tron_thuat_ngu) tắt suy luận ẩn để giảm TTFT; câu so
# sánh/nhiều ràng buộc vẫn dùng default_thinking_level. Xem docs/phase4-fix-audit.md.
simple_query_thinking_level: none
# Đo trên dev set: 3072 cắt cụt 6/40 lượt (câu so sánh/nhiều ràng buộc) làm hỏng schema
# JSON và mất trích dẫn; 6144 phủ trên mức lớn nhất từng thấy (5.605 token đầu ra).
max_output_tokens: 6144
schema_retries: 1
require_citation: true
confidence_warning_threshold: 0.55
max_context_tokens: 6000
chars_per_token: 3.5
max_prompt_tokens: 12000
judge_provider: deepseek_primary

# DeepSeek là nhà cung cấp duy nhất cho mọi tác vụ sinh văn bản.
# Gemini chỉ dùng cho embedding 768 chiều, không xuất hiện trong chain này.
providers:
  - name: deepseek_primary
    type: openai_compat
    enabled: true
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    model_env: DEEPSEEK_MODEL
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    timeout_ms: 180000
    max_retries: 2
    backoff_base_s: 2.0
    backoff_max_s: 20.0
    max_output_tokens: 6144
    temperature: 0.2
    pricing:
      input_per_million: 0.0
      output_per_million: 0.0

chain:
  - deepseek_primary

logging:
  enabled: true
  table: query_logs
